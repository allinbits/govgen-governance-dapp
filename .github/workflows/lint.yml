name: Lint Check
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
jobs:
  lint_check:
    name: Linting
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Install dependencies
      run: npm install -g pnpm@8.15.9 && pnpm install --frozen-lockfile
    - name: Run Lint check
      run: pnpm lint
